# Quantitize Platform — Web + API
# 在 quantitize-platform 根目录:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# API 镜像由 P6-T1 预先构建（含 yolov8 环境，约 21GB）。
# --build 只重建 Web；不要在这里解压 yolov8_env.tar.gz。
# 禁止: docker compose down -v （会误伤命名卷；本编排用的是宿主机绑定挂载）

name: quantitize-platform

services:
  quantitize-api:
    image: quantitize-platform-api:latest
    container_name: quantitize-platform-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      PLATFORM_ROOT: /home/rs/wrs/onnxviewe/quantitize-platform
      OUTPUT_DATA_ROOT: /home/rs/wrs/onnxviewe/quantitize-platform/data/output_data
      SHARED_DATA_ROOT: /home/rs/wrs/onnxviewe/quantitize-platform/data/shared_data
      TASK_SCRATCH_ROOT: /scratch/quantitize
      TASK_SCRATCH_MIN_FREE_BYTES: "${TASK_SCRATCH_MIN_FREE_BYTES:-161061273600}"
      FPGA_PACK_WORKERS: "${FPGA_PACK_WORKERS:-8}"
      PT_EVAL_BATCH_SIZE: "${PT_EVAL_BATCH_SIZE:-8}"
      # CUDA calibration passed two full A/B runs; CPU remains the fallback
      # provider and can be forced with QUANTIZE_CALIBRATION_PROVIDER=cpu.
      QUANTIZE_CALIBRATION_PROVIDER: "${QUANTIZE_CALIBRATION_PROVIDER:-cuda}"
      YOLOV8_PYTHON: /home/rs/miniconda3/envs/yolov8/bin/python
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      GPU_READINESS_REQUIRED: "${GPU_READINESS_REQUIRED:-1}"
      GPU_MIN_FREE_MIB: "${GPU_MIN_FREE_MIB:-24576}"
      GPU_MAX_UTILIZATION_PERCENT: "${GPU_MAX_UTILIZATION_PERCENT:-90}"
      GPU_READY_POLL_SECONDS: "${GPU_READY_POLL_SECONDS:-15}"
    volumes:
      - ../data/output_data:/home/rs/wrs/onnxviewe/quantitize-platform/data/output_data
      - ../data/shared_data:/home/rs/wrs/onnxviewe/quantitize-platform/data/shared_data
      - /data1/ywang/quantitize-scratch:/scratch/quantitize
      # H200 迁移后的共享集已解引用并恢复到 ../data/shared_data，
      # 不再依赖 wrs 上旧项目的绝对路径。
      # 代码热更新，避免每次改 Python 都重建 21GB API 镜像
      - ../apps/api:/home/rs/wrs/onnxviewe/quantitize-platform/apps/api
      - ../pipeline:/home/rs/wrs/onnxviewe/quantitize-platform/pipeline
    # 必须显式分配单卡或 MIG UUID；容器内会映射为逻辑 GPU 0。
    gpus:
      - driver: nvidia
        device_ids:
          - "${GPU_DEVICE_ID:?GPU_DEVICE_ID_is_required}"
        capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  quantitize-web:
    image: quantitize-platform-web:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: quantitize-platform-web
    ports:
      - "${PORT:-8088}:8080"
    environment:
      WEB_DEMO_MODE: "${WEB_DEMO_MODE:-0}"
      API_BASE_URL: http://quantitize-api:8000
      PORT: "8080"
    volumes:
      - ../apps/web:/app
    depends_on:
      quantitize-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
