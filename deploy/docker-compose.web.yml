# M1：仅前端。在 quantitize-platform 根目录:
#   docker compose -f deploy/docker-compose.web.yml up --build

services:
  quantitize-web:
    image: quantitize-platform-web:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: quantitize-platform-web
    ports:
      - "${PORT:-8088}:8080"
    environment:
      WEB_DEMO_MODE: "${WEB_DEMO_MODE:-0}"
      API_BASE_URL: "${API_BASE_URL:-http://quantitize-api:8000}"
      PORT: "8080"
    restart: unless-stopped
